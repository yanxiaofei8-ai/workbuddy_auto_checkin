name: 双账号 Buddy 每日签到

# 云端 runner 执行，不依赖任何本机电源、开机状态或桌面客户端。
# 脚本是幂等的：今日已签到会安全跳过，旅行名额用尽不会重派，
# 因此同一天多次触发不会重复领取积分。

on:
  schedule:
    # GitHub cron 为尽力而为，高负载时可能延迟或丢弃；
    # 设三个时段互为备份，任一跑到即完成当天任务。
    # 间隔 6 小时 > 猫猫旅行最长 4 小时，下一轮可领回已到家的礼物。
    # 均为 UTC，括号内为北京时间（UTC+8）。
    - cron: "10 0 * * *"    # 00:10 UTC = 08:10 北京（主时段）
    - cron: "10 6 * * *"    # 06:10 UTC = 14:10 北京（备份）
    - cron: "10 12 * * *"   # 12:10 UTC = 20:10 北京（备份）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wb-dual-daily
  cancel-in-progress: false

jobs:
  account_a:
    name: 账号 A
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --quiet websocket-client

      - name: 执行签到与 Buddy 旅行
        env:
          # 可选：在仓库 Variables 配置自定义别名（配置后通知只显示别名）
          # 未配置时，cloud_run.py 会从令牌自动识别账号并脱敏显示
          ACCOUNT_LABEL: ${{ vars.ACCOUNT_LABEL_A }}
          WB_RT: ${{ secrets.WB_RT_A }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # 企业微信智能机器人（API 模式 · WebSocket 长连接 · 主动推送）
          WB_BOT_ID: ${{ secrets.WB_BOT_ID }}
          WB_BOT_SECRET: ${{ secrets.WB_BOT_SECRET }}
          WECOM_CHAT_ID: ${{ vars.WECOM_CHAT_ID }}
        run: |
          set -uo pipefail
          # 每个账号使用独立 HOME，避免令牌文件互相覆盖
          export HOME="$RUNNER_TEMP/acc_a"
          mkdir -p "$HOME"
          python scripts/cloud_run.py

  account_b:
    name: 账号 B
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --quiet websocket-client

      - name: 执行签到与 Buddy 旅行
        env:
          ACCOUNT_LABEL: ${{ vars.ACCOUNT_LABEL_B }}
          WB_RT: ${{ secrets.WB_RT_B }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # 企业微信智能机器人（API 模式 · WebSocket 长连接 · 主动推送）
          WB_BOT_ID: ${{ secrets.WB_BOT_ID }}
          WB_BOT_SECRET: ${{ secrets.WB_BOT_SECRET }}
          WECOM_CHAT_ID: ${{ vars.WECOM_CHAT_ID }}
        run: |
          set -uo pipefail
          export HOME="$RUNNER_TEMP/acc_b"
          mkdir -p "$HOME"
          python scripts/cloud_run.py
